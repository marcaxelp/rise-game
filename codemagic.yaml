workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Extract zip cleanly
        script: |
          # __MACOSX çöplerini yoksayarak zip'i açıyoruz
          unzip -q -o ios/App/ios.zip -d . -x "__MACOSX/*"
      - name: Install dependencies
        script: |
          # Podfile'ın nerede olduğunu dinamik olarak bulup içine giriyoruz
          PODFILE_DIR=$(find . -name "Podfile" -exec dirname {} \; | head -n 1)
          echo "Podfile dizini: $PODFILE_DIR"
          cd "$PODFILE_DIR"
          pod install
      - name: Build ipa
        script: |
          PODFILE_DIR=$(find . -name "Podfile" -exec dirname {} \; | head -n 1)
          cd "$PODFILE_DIR"
          WORKSPACE=$(find . -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/
