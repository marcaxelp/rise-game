workflows:
  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Extract iOS project
        script: |
          if [ -f ios/App/ios.zip ]; then
            unzip ios/App/ios.zip -d ios/
          fi
      - name: Install dependencies
        script: |
          cd ios/App
          pod install
      - name: Build ipa
        script: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphoneos -configuration Release archive -archivePath build/App.xcarchive
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist exportOptions.plist -exportPath build/
