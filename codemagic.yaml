workflows:
  ios-release:
    name: iOS Build Workflow
    instance_type: mac_mini_m2
    max_build_duration: 60
    scripts:
      - name: Prepare Web Directory and Dependencies
        script: |
          mkdir -p www
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/ios
      - name: Generate iOS Platform
        script: |
          npx cap add ios || true
          npx cap sync ios
      - name: Build iOS App Project
        script: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
                     -scheme App \
                     -sdk iphoneos \
                     -configuration Release \
                     -derivedDataPath build \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     clean build
          
          # Indirilebilir IPA yapısı oluşturma
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r App.ipa Payload
          mv App.ipa ../../App.ipa
    artifacts:
      - "*.ipa"
      - ios/App/build/Build/Products/Release-iphoneos/*.app
